name: Build and publish wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            plat: macosx_11_0_arm64
          - os: macos-15          # Intel Mac (macos-13 deprecated)
            plat: macosx_10_15_x86_64
          - os: ubuntu-latest     # Linux x86_64
            plat: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm  # Linux ARM64
            plat: manylinux_2_17_aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc

      - name: Build libinferbit
        run: |
          cd libinferbit
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run C tests
        run: |
          cd libinferbit
          ./build/test_inferbit
          ./build/test_ibf_loader
          ./build/test_forward
          ./build/test_convert

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle library into package
        run: |
          mkdir -p inferbit
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp libinferbit/build/libinferbit.dylib inferbit/
          else
            cp libinferbit/build/libinferbit.so inferbit/
          fi

      - name: Build wheel
        run: |
          pip install setuptools wheel build
          python -m build --wheel

      - name: Rename wheel with platform tag
        run: |
          cd dist
          for f in *.whl; do
            new=$(echo "$f" | sed "s/py3-none-any/py3-none-${{ matrix.plat }}/")
            mv "$f" "$new"
          done
          ls -la *.whl

      - name: Run Python tests
        run: |
          pip install "dist/$(ls dist/*.whl | head -1)[cli]"
          pip install pytest
          pytest tests/ -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
