name: Build and publish wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            arch: arm64
            plat: macosx_11_0_arm64
          - os: macos-13          # Intel Mac
            arch: x86_64
            plat: macosx_10_15_x86_64
          - os: ubuntu-latest     # Linux x86_64
            arch: x86_64
            plat: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm  # Linux ARM64
            arch: aarch64
            plat: manylinux_2_17_aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build libinferbit
        run: |
          cd modules/libinferbit
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run C tests
        run: |
          cd modules/libinferbit
          ./build/test_inferbit
          ./build/test_ibf_loader
          ./build/test_forward
          ./build/test_convert

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle library into package
        run: |
          cd modules/inferbit-py
          mkdir -p inferbit

          # Copy the built library
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp ../libinferbit/build/libinferbit.dylib inferbit/
          else
            cp ../libinferbit/build/libinferbit.so inferbit/
          fi

      - name: Build wheel
        run: |
          cd modules/inferbit-py
          pip install setuptools wheel build
          python -m build --wheel

      - name: Rename wheel with platform tag
        run: |
          cd modules/inferbit-py/dist
          # Rename from py3-none-any to platform-specific
          for f in *.whl; do
            new=$(echo "$f" | sed "s/py3-none-any/py3-none-${{ matrix.plat }}/")
            mv "$f" "$new"
          done
          ls -la *.whl

      - name: Run Python tests
        run: |
          cd modules/inferbit-py
          pip install dist/*.whl'[cli]'
          pip install pytest
          pytest tests/ -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: modules/inferbit-py/dist/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
