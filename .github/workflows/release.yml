name: Build and publish wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (native)
          - os: macos-14
            plat: macosx_11_0_arm64
            lib: libinferbit.dylib
            cmake_extra: ""
            can_test: true

          # macOS Intel (cross-compile on ARM runner)
          - os: macos-14
            plat: macosx_10_15_x86_64
            lib: libinferbit.dylib
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            can_test: false

          # Linux x86_64 (native)
          - os: ubuntu-latest
            plat: manylinux_2_17_x86_64
            lib: libinferbit.so
            cmake_extra: ""
            can_test: true

          # Linux ARM64 (native)
          - os: ubuntu-24.04-arm
            plat: manylinux_2_17_aarch64
            lib: libinferbit.so
            cmake_extra: ""
            can_test: true

          # Windows x64 (native)
          - os: windows-latest
            plat: win_amd64
            lib: Release/inferbit.dll
            cmake_extra: "-A x64"
            can_test: true

          # Windows ARM64 (cross-compile)
          - os: windows-latest
            plat: win_arm64
            lib: Release/inferbit.dll
            cmake_extra: "-A ARM64"
            can_test: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc

      - name: Build libinferbit (Unix)
        if: runner.os != 'Windows'
        run: |
          cd libinferbit
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}
          cmake --build build

      - name: Build libinferbit (Windows)
        if: runner.os == 'Windows'
        run: |
          cd libinferbit
          cmake -B build ${{ matrix.cmake_extra }}
          cmake --build build --config Release

      - name: Run C tests
        if: matrix.can_test
        working-directory: libinferbit
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            build/Release/test_inferbit.exe
            build/Release/test_ibf_loader.exe
            build/Release/test_forward.exe
            build/Release/test_convert.exe
          else
            ./build/test_inferbit
            ./build/test_ibf_loader
            ./build/test_forward
            ./build/test_convert
          fi
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle library and build wheel
        run: |
          cp libinferbit/build/${{ matrix.lib }} inferbit/
          pip install setuptools wheel build
          python -m build --wheel
        shell: bash

      - name: Rename wheel with platform tag
        run: |
          cd dist
          for f in *.whl; do
            new=$(echo "$f" | sed "s/py3-none-any/py3-none-${{ matrix.plat }}/")
            mv "$f" "$new"
          done
          ls -la *.whl
        shell: bash

      - name: Install and test
        if: matrix.can_test
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          pip install "${WHEEL}[cli]"
          pip install pytest
          pytest tests/ -v
        shell: bash

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
